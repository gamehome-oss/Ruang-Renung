# GANTI baris "repo" dengan akun dan nama repositori GitHub-mu, contoh: budi/ruang-renung
backend:
  name: github
  repo: gamehome-oss/Ruang-Renung
  branch: main
  base_url: https://ruangrenung.pages.dev
  auth_endpoint: api/auth

site_url: https://ruangrenung.pages.dev
display_url: https://ruangrenung.pages.dev
media_folder: uploads
public_folder: /uploads

collections:
  - name: esai
    label: Esai
    files:
      - name: essays
        label: Semua esai
        file: data/essays.json
        fields:
          - label: Daftar esai
            name: essays
            widget: list
            label_singular: Esai
            summary: "{{fields.title}}"
            fields:
              - { label: Judul, name: title, widget: string }
              - { label: Topik, name: topic, widget: string, default: Refleksi, hint: "Contoh: Refleksi, Ekonomi, Manajemen" }
              - { label: Tanggal, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: Kutipan singkat, name: excerpt, widget: string, required: false, hint: "Tampil di arsip. Kosongkan agar dibuat otomatis dari kalimat pertama." }
              - { label: Isi esai, name: body, widget: text, hint: "Satu baris baru menjadi satu paragraf." }
              - { label: Catatan penulis, name: note, widget: text, required: false, hint: "Opsional. Tampil kecil di akhir esai." }
